name: drift_dev
description: Dev-dependency for users of drift. Contains the generator and development tools.
version: 2.26.0
repository: https://github.com/simolus3/drift
homepage: https://drift.simonbinder.eu/
issue_tracker: https://github.com/simolus3/drift/issues

topics:
  - codegen
  - build-runner
  - drift
  - database

funding:
  - https://github.com/sponsors/simolus3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  charcode: ^1.3.1
  collection: ^1.15.0
  recase: ^4.1.0
  meta: ^1.3.0
  path: ^1.9.0
  json_annotation: ^4.9.0
  stream_transform: ^2.1.0

  # CLI
  args: ^2.4.0
  logging: ^1.2.0
  cli_util: ^0.4.0
  yaml: ^3.1.0
  io: ^1.0.3

  # Drift-specific analysis and apis
  drift: ">=2.26.0 <2.27.0"
  sqlite3: ^2.4.6
  sqlparser: ^0.41.0

  # Dart analysis
  analyzer: ^7.4.0
  source_span: ^1.10.0
  package_config: ^2.1.0
  pub_semver: ^2.1.4

  # Build system
  build: ^2.4.0
  build_resolvers: ^2.4.0
  build_config: ^1.1.0
  dart_style: ">=2.3.7 <4.0.0"
  source_gen: ">=1.5.0 <3.0.0"
  string_scanner: ^1.2.0

dev_dependencies:
  lints: ^5.1.0
  checked_yaml: ^2.0.3
  test: ^1.25.0
  test_descriptor: ^2.0.1
  build_runner: ^2.4.0
  build_test: ^2.2.0
  json_serializable: ^6.8.0
  crypto: ^3.0.3
  glob: ^2.1.2

dependency_overrides:
  analyzer: ^7.3.0
  # package:build with element2 APIs is not released yet.
  build:
    git:
      url: https://github.com/dart-lang/build.git
      path: build
      ref: resolver-2-methods
  build_resolvers:
    git:
      url: https://github.com/dart-lang/build.git
      path: build_resolvers
      ref: resolver-2-methods
  build_runner:
    git:
      url: https://github.com/dart-lang/build.git
      path: build_runner
      ref: resolver-2-methods
  build_runner_core:
    git:
      url: https://github.com/dart-lang/build.git
      path: build_runner_core
      ref: resolver-2-methods
  build_test:
    git:
      url: https://github.com/dart-lang/build.git
      path: build_test
      ref: resolver-2-methods
  source_gen:
    git:
      url: https://github.com/dart-lang/source_gen.git
      path: source_gen
      ref: analyzer-element2

executables:
  drift_dev:
