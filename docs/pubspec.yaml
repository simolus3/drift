name: drift_website
description: Documentation website for the drift project, built with jaspr.
publish_to: none

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ^3.35.0

dependencies:
  jaspr: ^0.24.0-beta.0
  jaspr_content: ^0.6.0-beta.0
  jaspr_router: ^0.10.0-beta.0

  clock: ^1.1.2
  drift:
  drift_flutter:
  drift_postgres:
  drift_dev:
  drift_sqflite:
  package_config: '>=2.2.0 <4.0.0'
  yaml: ^3.1.3
  watcher: ^1.1.3
  path: ^1.9.1
  json_annotation: ^4.9.0
  sqlite3: ^3.0.0
  sqlite3_test: ^0.2.0
  file: ^7.0.1
  test: ^1.26.3
  rxdart: ^0.28.0
  jaspr_content_snippets: ^0.2.8-beta.0
  glob: ^2.1.3
  markdown: ^7.3.0
  jaspr_docsy:
    hosted: https://pub-simonbinder-eu.fsn1.your-objectstorage.com
    version: 0.0.8-beta.0
  universal_web: ^1.1.1
  http: ^1.5.0
  web: ^1.1.1
  riverpod: ^3.2.0
  jaspr_riverpod: ^0.5.0-beta-0
  path_provider: ^2.1.4
  postgres: ^3.5.8
  uuid: ^4.5.2
  sqflite_common: ^2.5.13 # Used in snippets


  flutter:
    sdk: flutter

dev_dependencies:
  build_runner: ^2.6.0
  build_web_compilers: ^4.8.12
  jaspr_builder: ^0.24.0-beta.0
#  jaspr_lints: ^0.5.1
  lints: ^6.0.0
  json_serializable: ^6.11.1
  sass_builder: ^2.4.0

  jaspr_cli: ^0.24.0-beta.0
  crypto: ^3.0.6

jaspr:
  mode: static

dependency_overrides:
  meta: ^1.17.0
  drift:
    path: ../drift
  drift_dev:
    path: ../drift_dev
  drift_flutter:
    path: ../drift_flutter
  drift_postgres:
    path: ../extras/legacy/drift_postgres
  drift_sqflite:
    path: ../drift_sqflite
  sqlparser:
    path: ../sqlparser

  # Sass depends on cli_pkg, https://github.com/google/dart_cli_pkg/pull/268.
  cli_util: ^0.6.0
