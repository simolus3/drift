  sqlite3: ^3.0.0
  sqlite3_web: ^0.9.1

dev_dependencies:
  build_runner: ^2.4.14
  drift_dev: ^2.21.0
  lints: ^6.0.0
  test: ^1.25.0
  flutter_test:
    sdk: flutter
  test_descriptor: ^2.0.1
  async: ^2.11.0
