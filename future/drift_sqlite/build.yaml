targets:
  $default:
    builders:
      drift_dev:
        options:
          drift3_preview: true
          dialects:
            - dialect: sqlite
              version: "3.37"
              modules:
                - json1
                - fts5
                - geopoly
      build_web_compilers:entrypoint:
        generate_for:
          - "web/worker.dart"
        options:
          compiler: dart2js
